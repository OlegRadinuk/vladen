# Боевой конфиг: /etc/nginx/sites-available/vladen (синхронизирован с сервером 2026-09-29).
# Требует в http-контексте (/etc/nginx/conf.d/vladen-ratelimit.conf):
#   limit_req_zone $binary_remote_addr zone=vladen_leads:1m rate=5r/m;

# HTTP — редирект на HTTPS
server {
    listen 80;
    server_name vladen-crimea.ru www.vladen-crimea.ru;
    return 301 https://vladen-crimea.ru$request_uri;
}

# HTTPS www → non-www
server {
    listen 443 ssl;
    server_name www.vladen-crimea.ru;

    ssl_certificate     /etc/letsencrypt/live/vladen-crimea.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vladen-crimea.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vladen-crimea.ru$request_uri;
}

# HTTPS — основной сервер
server {
    listen 443 ssl;
    server_name vladen-crimea.ru;

    ssl_certificate     /etc/letsencrypt/live/vladen-crimea.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vladen-crimea.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # /_next/static/ — раздаём с диска (иммутабельный хэш в имени файла)
    location /_next/static/ {
        alias /var/www/vladen/.next/standalone/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Медиафайлы из public/ — раздаём с диска, fallback в Node если нет
    location ~* \.(jpg|jpeg|png|webp|avif|gif|svg|ico|woff|woff2|mp4|MP4)$ {
        root /var/www/vladen/.next/standalone/public;
        try_files $uri @node;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Fallback — Node (для /_next/image?url=... и всего что не нашлось на диске)
    location @node {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # IndexNow key file
    location = /ff1c78ad94d920da9ca776e1826b3038.txt {
        default_type text/plain;
        return 200 "ff1c78ad94d920da9ca776e1826b3038";
    }

    # Форма заявок — rate-limit (5/мин + burst 5 с одного IP), маленькое тело
    location = /api/telegram {
        limit_req zone=vladen_leads burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }

    # Всё остальное — Node (SSE, API, страницы)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Размер тела запроса
    client_max_body_size 10M;
}
