server {
    listen 80;
    server_name vladen-crimea.ru www.vladen-crimea.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vladen-crimea.ru www.vladen-crimea.ru;

    ssl_certificate     /etc/letsencrypt/live/vladen-crimea.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vladen-crimea.ru/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # /_next/static/ — раздаём с диска (иммутабельный хэш в имени файла)
    location /_next/static/ {
        alias /var/www/vladen/.next/standalone/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Медиафайлы из public/ — раздаём с диска, fallback в Node если нет
    location ~* \.(jpg|jpeg|png|webp|avif|gif|svg|ico|woff|woff2|mp4|MP4)$ {
        root /var/www/vladen/.next/standalone/public;
        try_files $uri @node;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Fallback — Node (для /_next/image?url=... и всего что не нашлось на диске)
    location @node {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Всё остальное — Node (SSE, API, страницы)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
    }
}
